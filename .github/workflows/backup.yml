# 每天自動備份資料庫（台灣時間 03:00），加密後存成 GitHub 的 Artifact，保留 90 天。
# 需要在 GitHub 倉庫 Settings → Secrets and variables → Actions 設定兩個 Secret：
#   BACKUP_DB_URL      Supabase 的「Session pooler」連線字串（含資料庫密碼）
#   BACKUP_PASSPHRASE  你自己決定的備份加密密碼（請另外保管，忘記就解不開）
# 還原方式：gpg -d 檔名.sql.gz.gpg | gunzip | psql "連線字串"
name: 每日備份資料庫

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 安裝 PostgreSQL 17 客戶端（要和 Supabase 版本一致）
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: 備份並加密
        env:
          DB_URL: ${{ secrets.BACKUP_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "缺少 BACKUP_DB_URL"; exit 1; }
          test -n "$PASS" || { echo "缺少 BACKUP_PASSPHRASE"; exit 1; }
          F="anxin-$(date -u +%Y%m%d-%H%M).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$F"
          test "$(stat -c %s "$F")" -gt 1000 || { echo "備份檔太小，可能失敗"; exit 1; }
          echo "FILE=$F" >> "$GITHUB_ENV"

      - name: 上傳加密備份
        uses: actions/upload-artifact@v4
        with:
          name: anxin-backup
          path: ${{ env.FILE }}
          retention-days: 90
          if-no-files-found: error
